
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: localworker-viewer-role
rules:
- apiGroups:
  - worker.saved.sh
  resources:
  - localworkers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - worker.saved.sh
  resources:
  - localworkers/status
  verbs:
  - get
