---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - worker.saved.sh
  resources:
  - localworkers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - worker.saved.sh
  resources:
  - localworkers/finalizers
  verbs:
  - update
- apiGroups:
  - worker.saved.sh
  resources:
  - localworkers/status
  verbs:
  - get
  - patch
  - update
