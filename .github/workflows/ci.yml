# Job graph, left to right:
#   lint, golangci-lint (config pinned in .golangci.yml)
#   test, manifests/generate/fmt/vet + envtest suite
#   compile, one job per arch, cross-compiled natively (no QEMU)
#   build, assemble & push the multi-arch image to GHCR
#
# The Dockerfile packages a prebuilt binary rather than compiling in-image.
# Compiling in-image makes buildx run the Go toolchain under QEMU for the
# non-native arch, which took ~40min for a single build.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - run: make test

      # controller-gen output is committed; if `make test` changed it, the
      # generated files in the PR are stale.
      - name: Check generated files are up to date
        run: git diff --exit-code -- config/ api/ internal/

  # Cross-compile per arch. Binaries feed the build job as artifacts, so the
  # image build itself never executes target-arch code and needs no QEMU.
  compile:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" -o dist/manager-${{ matrix.goarch }} cmd/main.go
      - uses: actions/upload-artifact@v7
        with:
          name: manager-${{ matrix.goarch }}
          path: dist/manager-${{ matrix.goarch }}
          retention-days: 1

  build:
    needs: compile
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Both arch binaries land back in dist/ as the Dockerfile expects.
      - uses: actions/download-artifact@v8
        with:
          pattern: manager-*
          path: dist
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        # GHCR reads the package description off the *index* annotation, not the
        # per-manifest one it annotates by default, without `index` here the
        # package page shows "No description provided".
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # git tag -> :v0.1.0 ; main -> :<short-sha> + :latest
          tags: |
            type=ref,event=tag
            type=sha,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=Kubernetes operator for saved.sh, CRDs and controllers
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
