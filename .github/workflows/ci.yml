# Job graph, left to right:
#   lint, golangci-lint (config pinned in .golangci.yml)
#   test, manifests/generate/fmt/vet + envtest suite
#   build, cross-compile + assemble & push the multi-arch image to GHCR
#
# There is deliberately no `compile` job. It used to cross-compile per arch and
# hand the binaries to `build` as Actions artifacts, which coupled every release
# to the artifact storage quota, when that filled on 2026-07-30 the upload
# failed, `compile` failed, and no image was published at all. The Dockerfile is
# multi-stage now and buildx does the cross-compiling natively, so nothing here
# touches artifact storage.
#
# The Dockerfile DOES compile in-image now, but its build stage is pinned to
# `--platform=$BUILDPLATFORM`, so the Go toolchain runs on the runner's NATIVE
# arch and cross-compiles via GOARCH. An unpinned build stage is what makes
# buildx run the toolchain under QEMU (~40min for a single build); the pin is
# load-bearing, do not remove it.
#
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# A rapid second push makes the first run's image obsolete before it publishes,
# so cancel it rather than paying for both. Tag builds are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - run: make test

      # controller-gen output is committed; if `make test` changed it, the
      # generated files in the PR are stale.
      - name: Check generated files are up to date
        run: git diff --exit-code -- config/ api/ internal/

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        # GHCR reads the package description off the *index* annotation, not the
        # per-manifest one it annotates by default, without `index` here the
        # package page shows "No description provided".
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # git tag -> :v0.1.0 ; main -> :<short-sha> + :latest
          tags: |
            type=ref,event=tag
            type=sha,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=Kubernetes operator for saved.sh, CRDs and controllers
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Turns an opaque red X into an explanation.
  #
  # GitHub records *why* a job failed in its check-run annotations, and the run
  # page does not show them. So "the runner was refused because org billing
  # lapsed" and "your code does not compile" both render as an identical red X,
  # the first one with no steps and no log to open. Telling them apart meant
  # querying the REST API by hand. This job does that automatically and writes
  # the answer to the run summary, where you actually look.
  #
  # It only runs when something failed, so a green pipeline costs nothing.
  explain:
    needs: [lint, test, build]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Explain what failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          jobs=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate)

          {
            echo "## Why this run failed"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "$jobs" | jq -r '.jobs[] | select(.name != "explain") | "| \(.name) | \(.conclusion // .status) |"'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$jobs" \
            | jq -r '.jobs[] | select(.conclusion=="failure") | "\(.id)\t\(.name)\t\(.steps|length)"' \
            | while IFS=$'\t' read -r id name nsteps; do
                note=$(gh api "/repos/${GITHUB_REPOSITORY}/check-runs/${id}/annotations" \
                         --jq '.[0].message // ""' 2>/dev/null | head -3)

                if [ "${nsteps:-0}" -eq 0 ]; then
                  {
                    echo "### ${name} — never started"
                    echo ""
                    echo "No steps ran and no minutes were billed. **Nothing is wrong with the code**:"
                    echo "GitHub declined to give this job a runner."
                    echo ""
                    [ -n "$note" ] && { echo "> ${note}"; echo ""; }
                    echo "That is an account-level block, normally a failed payment, an exhausted"
                    echo "spending limit, or Actions disabled for the org. Check **Settings → Billing"
                    echo "& plans** for \`${GITHUB_REPOSITORY_OWNER}\`."
                    echo ""
                    echo "Re-running will not help until that clears — it fails again in ~2s."
                    echo ""
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "::error title=${name}: job never started::Runner refused. Check ${GITHUB_REPOSITORY_OWNER} org billing, not the code."
                else
                  failed=$(echo "$jobs" | jq -r --arg n "$name" \
                    '.jobs[] | select(.name==$n) | .steps[]? | select(.conclusion=="failure") | .name' | head -1)
                  short=$(printf '%.70s' "${failed:-unknown}")
                  {
                    echo "### ${name} — failed at \`${short}\`"
                    echo ""
                    [ -n "$note" ] && { echo "> ${note}"; echo ""; }
                    echo "Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                    echo ""
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "::error title=${name} failed::step: ${short}"
                fi
              done
