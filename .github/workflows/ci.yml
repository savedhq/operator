# Test, build and publish the image. One job, native runner, arm64 only.
# Why it is shaped this way: pm/docs/man/go-cicd.md ("As applied at saved").
#
# Images are tagged :<short-sha> on main and :<tag> on a git tag, matching what
# infra/clusters/oci/apps/**/deployment.yaml pins.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# A rapid second push makes the first run's image obsolete before it publishes,
# so cancel it rather than paying for both. Tag builds are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - run: make lint

  ci:
    # arm64 only: every OCI node is Ampere, local dev is Apple Silicon. The
    # runner is native for the target arch, so nothing is emulated.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - run: make test

      # controller-gen output is committed; if `make test` changed it, the
      # generated files in the PR are stale.
      - name: Check generated files are up to date
        run: git diff --exit-code -- config/ api/ internal/

      # Native build on the matrix runner, against the cache `make test` just
      # filled. The Dockerfile only copies the result in.
      - name: Build binary
        if: github.event_name == 'push'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.arch }}" \
            go build -trimpath -ldflags="-s -w" -o "dist/manager-${{ matrix.arch }}" cmd/main.go

      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push'

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        if: github.event_name == 'push'
        # GHCR reads the package description off the *index* annotation, not the
        # per-manifest one it annotates by default, without `index` here the
        # package page shows "No description provided".
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # git tag -> :v0.1.0 ; main -> :<short-sha> + :latest
          tags: |
            type=ref,event=tag
            type=sha,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=Kubernetes operator for saved.sh, CRDs and controllers
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v7
        if: github.event_name == 'push'
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
