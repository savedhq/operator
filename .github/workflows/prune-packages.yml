name: prune-packages

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 50
          delete-only-untagged-versions: false

      - name: Report remaining versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api \
            "/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions" \
            --paginate --jq '.[].id' 2>/dev/null | wc -l | tr -d ' ') || n="unknown"
          {
            echo "### ${{ github.event.repository.name }}"
            echo ""
            echo "Versions remaining after prune: **${n}** (~$((${n:-0} / 5)) releases)"
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
